[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-instruction-litmus"
version = "0.2.1"
description = "Behavior fixtures for coding-agent instruction files such as AGENTS.md, CLAUDE.md, and GEMINI.md."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Ilia Sorokin" }]
keywords = [
  "agents-md",
  "claude-md",
  "gemini-md",
  "coding-agent",
  "instruction-following",
  "conformance",
  "developer-tools",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing",
]

[project.scripts]
agent-instruction-litmus = "agent_instruction_litmus.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
