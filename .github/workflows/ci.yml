name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests
      - name: List fixtures
        run: agent-instruction-litmus fixtures
      - name: Score generated root fixture
        run: |
          agent-instruction-litmus init --fixture root-agents-md --output /tmp/litmus-root
          python - <<'PY'
          from pathlib import Path
          Path("/tmp/litmus-root/result.txt").write_text("INSTRUCTION_LITMUS_ROOT_PASS\n", encoding="utf-8")
          PY
          agent-instruction-litmus score --fixture root-agents-md --workspace /tmp/litmus-root

  public-install:
    name: Public v0.2.2 install smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install immutable public release
        run: python -m pip install "git+https://github.com/itscloud0/agent-instruction-litmus.git@27e27dd3c5f7b5666c46adcfc55ea92ddc7543f5"
      - name: Verify installed release and fixtures
        run: |
          python - <<'PY'
          from agent_instruction_litmus import __version__

          assert __version__ == "0.2.2"
          PY
          agent-instruction-litmus fixtures | tee /tmp/fixtures.txt
          grep -q $'^root-agents-md\t' /tmp/fixtures.txt
          grep -q $'^gemini-memory-reload\t' /tmp/fixtures.txt
